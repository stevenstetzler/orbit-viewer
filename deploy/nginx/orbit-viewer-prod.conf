# Static -- install once, doesn't change per-deploy (a deploy just
# restarts the process behind it, see orbit-viewer-prod.service). Port
# 9000 must match that unit's own --port. Include this from whichever
# server{} block already owns your domain (see deploy/README.md) --
# this file is deliberately just the location block, not a whole
# server{} of its own, since TLS/the domain itself are already handled
# there.
location / {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
